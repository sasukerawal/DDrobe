plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ddrobe.backgroundremover'
version = '1.0.0'

android {
  namespace "expo.modules.ddrobe.backgroundremover"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // On-device ML Kit subject segmentation (model delivered by Google Play services).
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
  implementation 'com.google.android.gms:play-services-tasks:18.2.0'
}
